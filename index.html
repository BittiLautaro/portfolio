<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[Marca] — Desarrollo de sistemas y páginas web</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Header fijo con navegación por anclas a cada sección -->
  <header class="header">
    <nav class="nav">
      <ul class="nav__menu">
        <li class="nav__item"><a class="nav__link" href="#inicio">Inicio</a></li>
        <li class="nav__item"><a class="nav__link" href="#servicios">Servicios</a></li>
        <li class="nav__item"><a class="nav__link" href="#proyectos">Proyectos</a></li>
        <li class="nav__item"><a class="nav__link" href="#sobre-mi">Sobre mí</a></li>
        <li class="nav__item"><a class="nav__link" href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- 1. Hero: título, subtítulo y botón de llamada a la acción -->
    <section class="hero" id="inicio">
      <h1 class="hero__titulo"></h1>
      <p class="hero__subtitulo"></p>
      <a class="btn btn--primario" href="#contacto"></a>
    </section>

    <!-- 2. Servicios: dos bloques según el tipo de trabajo -->
    <section class="servicios" id="servicios">
      <h2 class="servicios__titulo"></h2>

      <article class="servicio">
        <h3 class="servicio__titulo"></h3>
        <p class="servicio__descripcion"></p>
      </article>

      <article class="servicio">
        <h3 class="servicio__titulo"></h3>
        <p class="servicio__descripcion"></p>
      </article>
    </section>

    <!-- 3. Proyectos: mismas dos categorías que Servicios -->
    <section class="proyectos" id="proyectos">
      <h2 class="proyectos__titulo"></h2>

      <article class="categoria-proyectos">
        <h3 class="categoria-proyectos__titulo"></h3>

        <article class="proyecto">
          <h4 class="proyecto__titulo"></h4>
          <p class="proyecto__descripcion"></p>
          <ul class="proyecto__stack">
            <li class="proyecto__stack-item"></li>
          </ul>
        </article>

        <article class="proyecto">
          <h4 class="proyecto__titulo"></h4>
          <p class="proyecto__descripcion"></p>
          <ul class="proyecto__stack">
            <li class="proyecto__stack-item"></li>
          </ul>
        </article>

        <article class="proyecto">
          <h4 class="proyecto__titulo"></h4>
          <p class="proyecto__descripcion"></p>
          <ul class="proyecto__stack">
            <li class="proyecto__stack-item"></li>
          </ul>
        </article>

        <article class="proyecto">
          <h4 class="proyecto__titulo"></h4>
          <p class="proyecto__descripcion"></p>
          <ul class="proyecto__stack">
            <li class="proyecto__stack-item"></li>
          </ul>
        </article>

        <article class="proyecto">
          <h4 class="proyecto__titulo"></h4>
          <p class="proyecto__descripcion"></p>
          <ul class="proyecto__stack">
            <li class="proyecto__stack-item"></li>
          </ul>
        </article>
      </article>

      <article class="categoria-proyectos">
        <h3 class="categoria-proyectos__titulo"></h3>

        <article class="proyecto">
          <h4 class="proyecto__titulo"></h4>
          <p class="proyecto__descripcion"></p>
          <ul class="proyecto__stack">
            <li class="proyecto__stack-item"></li>
          </ul>
        </article>

        <article class="proyecto">
          <h4 class="proyecto__titulo"></h4>
          <p class="proyecto__descripcion"></p>
          <ul class="proyecto__stack">
            <li class="proyecto__stack-item"></li>
          </ul>
        </article>
      </article>
    </section>

    <!-- 4. Sobre mí: formación y forma de trabajar -->
    <section class="sobre-mi" id="sobre-mi">
      <h2 class="sobre-mi__titulo"></h2>
      <p class="sobre-mi__texto"></p>
    </section>

    <!-- 5. Contacto: links a WhatsApp e Instagram -->
    <section class="contacto" id="contacto">
      <h2 class="contacto__titulo"></h2>
      <a class="btn btn--secundario contacto__link contacto__link--whatsapp" href=""></a>
      <a class="btn btn--secundario contacto__link contacto__link--instagram" href=""></a>
    </section>

  </main>

  <footer class="footer">
    <p class="footer__texto"></p>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
